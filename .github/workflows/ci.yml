name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  lint:
    name: lint (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint -w @lra/ops-web

  rls:
    name: RLS regression suite (canary must fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # supabase start gives this job a real Postgres including the
      # `auth` schema, which is what makes running the RLS suite on
      # every PR possible at all (PLAN.md §0.6) -- HR's entire security
      # history before this was "found by hand, in production, five
      # rounds late."
      - name: Start local Supabase stack
        run: npx supabase@latest start

      - name: Apply migrations (local db reset — never run against a linked project)
        run: npx supabase@latest db reset

      - name: Run the RLS regression suite
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          chmod +x scripts/run-rls-tests.sh
          ./scripts/run-rls-tests.sh | tee rls-output.txt
          echo "--- verifying the canary line is present in the log ---"
          grep -q "ALL PASS (canary correctly failed)" rls-output.txt

      - name: Stop the local Supabase stack
        if: always()
        run: npx supabase@latest stop
